# ====================== AI / LLM ======================
llm:
  provider: "gemini"
  api_key: "YOUR_API_KEY"
  model: "gemini-2.0-flash"
  temperature: 0.9
  max_output_tokens: 120
  base_url: null

gemini:
  api_key: ""
  model: "gemini-2.0-flash"
  temperature: 0.9
  max_output_tokens: 120

owner:
  names:
    - "YourBattleTag"
    - "YourInGameName"
  command_prefix: "!"

personality:
  aggressiveness: 8
  political_mode: "propaganda_left"
  response_length: "medium"
  emoji_intensity: 0
  sc2_reference_level: 0                  # 0 = no SC2 references; 10 = full game talk
  topics:
    politics: true
    current_events: true
    in_game_strategy: false
    memes: false
    personal: true

# ====================== REPLY BLACKLIST ======================
# Applied to every outbound AI/canned reply (after generation).
# Order: replacements → symbols → letters → substrings → words.
# Add more by appending list items, e.g. words: ["as an AI"] or symbols: ["…"]
blacklist:
  case_sensitive: false
  words: []                 # whole words/phrases to remove, e.g. - "forbidden"
  symbols:
    - "—"                   # em dash (add more symbols on new lines with - "…")
  letters: []               # single characters to strip, e.g. - "x"
  substrings: []            # remove anywhere in the string, e.g. - "http"
  replacements:             # map banned text → replacement (runs first)
    "—": "-"                # em dash → normal hyphen

# ====================== FAVORITE WORDS ======================
# Nudges the model to use these words/phrases more when natural.
# intensity: soft | medium | strong
# Add favorites under words, e.g. - "bruh"
favorites:
  intensity: medium
  words: []

behaviour:
  min_reply_delay_sec: 0.35
  max_reply_delay_sec: 0.8
  typo_chance: 0.0
  reply_probability: 1.0
  ignore_self: true
  ignore_system: true
  reply_to_game_requests: false
  game_request_use_canned: false
  address_by_name: true
  name_separator: ", "

anti_spam:
  global_cooldown_sec: 1
  per_player_cooldown_sec: 3
  max_replies_per_player_per_minute: 8
  mute_list: []

memory:
  max_messages_per_player: 30
  persist_path: "logs/memory.json"

triggers: []
canned_blocks: []

logging:
  level: "INFO"
  file: "logs/sc2_chatbot.log"
  console: true

chat_backend: "simulated"

sc2_stub:
  window_title: "StarCraft II"
  chat_key: "enter"
  send_key: "enter"
  input_method: "paste"
  ocr_enabled: false
  poll_interval_sec: 0.45
  chat_region: null
  tesseract_cmd: null
  switch_channels: false
  channel_switch_key: "tab"
  assume_chat_opens_on_tab: 1
  max_chat_tabs: 8
  self_name: "YourInGameName"
