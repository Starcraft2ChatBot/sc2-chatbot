# ====================== AI / LLM ======================
# Prefer this block. You can still use the legacy "gemini:" section alone.
llm:
  provider: "gemini"                      # gemini | openai | openai_compatible | openrouter | custom
  api_key: "YOUR_API_KEY"                 # or LLM_API_KEY / GEMINI_API_KEY env
  model: "gemini-2.0-flash"               # set any model id your provider supports
  # Examples:
  #   model: "gemini-2.0-flash"
  #   model: "gemini-2.5-flash"
  #   model: "gpt-4o-mini"                # with provider openai / openrouter
  temperature: 0.85
  max_output_tokens: 180
  base_url: null                          # set for openrouter / custom OpenAI-compatible APIs
  # base_url: "https://openrouter.ai/api/v1"
  # base_url: "http://127.0.0.1:1234/v1"  # local LM Studio / etc.

# Legacy (still works if llm is omitted)
gemini:
  api_key: ""
  model: "gemini-2.0-flash"
  temperature: 0.85
  max_output_tokens: 180

owner:
  names:
    - "YourBattleTag"
    - "YourInGameName"
  command_prefix: "!"

personality:
  aggressiveness: 5
  political_mode: "neutral"
  response_length: "medium"
  emoji_intensity: 3
  topics:
    politics: true
    current_events: true
    in_game_strategy: true
    memes: true
    personal: false

behaviour:
  min_reply_delay_sec: 1.2
  max_reply_delay_sec: 7.5
  typo_chance: 0.05
  reply_probability: 0.9                  # higher = more conversational coverage
  ignore_self: true
  ignore_system: true
  reply_to_game_requests: true
  game_request_use_canned: false          # false = use AI for [1v1] etc. (better conversations)
  address_by_name: true                   # "PlayerName, message…"
  name_separator: ", "

anti_spam:
  global_cooldown_sec: 8
  per_player_cooldown_sec: 25
  max_replies_per_player_per_minute: 3
  mute_list: []

memory:
  max_messages_per_player: 30
  persist_path: "logs/memory.json"

triggers:
  - name: "gg"
    patterns:
      - "(?i)\\bgg\\b"
    response: "gg wp"
    priority: 100
    cooldown_sec: 15
    channels: ["all", "team"]

canned_blocks: []

logging:
  level: "INFO"
  file: "logs/sc2_chatbot.log"
  max_bytes: 10485760
  backup_count: 5
  console: true

chat_backend: "simulated"

sc2_stub:
  window_title: "StarCraft II"
  chat_key: "enter"
  send_key: "enter"
  typing_speed_cps: 11
  input_method: "paste"                   # paste = full message then Enter (fixes early send)
  ocr_enabled: false
  poll_interval_sec: 1.8
  chat_region: null
  tesseract_cmd: null
  # tesseract_cmd: "C:/Program Files/Tesseract-OCR/tesseract.exe"
